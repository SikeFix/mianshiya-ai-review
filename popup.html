<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>面试鸭 AI 复习助手</title>
    <style>
      :root {
        --border: #e4e6eb;
        --text: #1f2328;
        --dim: #6b7280;
        --primary: #6366f1;
        --bg: #f7f8fa;
        --ok: #10b981;
        --warn: #f59e0b;
      }
      * { box-sizing: border-box; }
      body {
        width: 310px; margin: 0; padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
        font-size: 13px; color: var(--text); background: #fff;
      }
      .head {
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: #fff; padding: 12px 14px;
        display: flex; align-items: center; gap: 10px;
      }
      .head img { width: 28px; height: 28px; border-radius: 7px; }
      .head .t { font-weight: 600; font-size: 13.5px; }
      .head .s { font-size: 11.5px; opacity: .88; }
      .body { padding: 12px 14px 14px; }
      .qbox {
        background: var(--bg); border: 1px solid var(--border); border-radius: 9px;
        padding: 9px 11px; margin-bottom: 12px;
      }
      .qbox .qt {
        font-weight: 600; font-size: 12.5px; line-height: 1.5;
        display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      }
      .qbox .qm { font-size: 11px; color: var(--dim); margin-top: 4px; }
      .qbox .qm.ok { color: var(--ok); }
      .qbox .qm.warn { color: var(--warn); }
      select {
        width: 100%; padding: 7px 10px; border: 1px solid var(--border);
        border-radius: 8px; background: var(--bg); color: var(--text);
        font-family: inherit; font-size: 12.5px; cursor: pointer; outline: none;
      }
      select:focus { border-color: var(--primary); }
      .lbl { font-size: 11.5px; color: var(--dim); margin: 12px 0 5px; }
      .lbl:first-child { margin-top: 0; }
      .check {
        display: flex; align-items: center; gap: 8px;
        padding: 9px 11px; border: 1px solid var(--border); border-radius: 9px;
        cursor: pointer; user-select: none; background: var(--bg);
      }
      .check input { margin: 0; width: 15px; height: 15px; accent-color: var(--primary); cursor: pointer; }
      .check .txt { flex: 1; }
      .check .txt .a { font-size: 12.5px; font-weight: 500; }
      .check .txt .b { font-size: 11px; color: var(--dim); }
      .actions { display: flex; gap: 8px; margin-top: 12px; }
      button {
        flex: 1; border: 1px solid var(--border); background: #fff; color: var(--text);
        padding: 8px 10px; border-radius: 8px;
        font-family: inherit; font-size: 12.5px; cursor: pointer; transition: all .15s;
      }
      button:hover { background: var(--bg); }
      button.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 500; }
      button.primary:hover { filter: brightness(1.08); }
      button:disabled { opacity: .45; cursor: not-allowed; }
      .foot {
        border-top: 1px solid var(--border); padding: 9px 14px;
        font-size: 11px; color: var(--dim); display: flex; justify-content: space-between;
        align-items: center;
      }
      .foot a { color: var(--primary); text-decoration: none; }
      .foot a:hover { text-decoration: underline; }
      kbd {
        background: var(--bg); border: 1px solid var(--border); border-bottom-width: 2px;
        border-radius: 4px; padding: 0 4px; font-size: 10.5px; font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div class="head">
      <img src="icons/icon48.png" alt="" />
      <div>
        <div class="t">面试鸭 AI 复习助手</div>
        <div class="s" id="stateText">检查中…</div>
      </div>
    </div>

    <div class="body">
      <div class="qbox" id="qbox">
        <div class="qt" id="qTitle">正在读取页面…</div>
        <div class="qm" id="qMeta"></div>
      </div>

      <label class="check" id="enableRow">
        <input type="checkbox" id="enabled" />
        <span class="txt">
          <span class="a">启用面板</span>
          <span class="b">关闭后所有页面都不再显示</span>
        </span>
      </label>

      <div class="lbl">当前 AI 方案</div>
      <select id="profile"></select>

      <div class="actions">
        <button id="btnShow" class="primary" type="button">显示面板</button>
        <button id="btnOptions" type="button">设置</button>
      </div>
    </div>

    <div class="foot">
      <span><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>M</kbd> 开关面板</span>
      <a href="#" id="linkSite" target="_blank" rel="noreferrer">打开面试鸭 ↗</a>
    </div>

    <script src="shared/config.js"></script>
    <script src="shared/store.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
